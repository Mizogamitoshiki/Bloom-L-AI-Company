# 公開コンテンツ禁止表現(通常コードで検査。AIの自己申告に依存しない)
# docs/03 §5.4, docs/13 §4, DECISIONS(竹プラン仮価格は公開禁止)
# patterns は JavaScript RegExp(uフラグ)として評価される
categories:
  - key: effect_guarantee
    label: 効果保証・誇大表現
    patterns:
      - "必ず(売上|集客|利益|成果|儲)"
      - "絶対に?(売上|集客|成果|効果)(が|は)?(出|上が|増え)"
      - "100(%|%)(の)?(効果|成果|集客)"
      - "確実に(売上|集客|成果|利益)"
      - "(SEO|検索順位).{0,10}(保証|確約)"
  - key: bamboo_price
    label: 竹プラン仮価格(社内検証用・公開禁止)
    patterns:
      - "(竹プラン|CMS(付き|搭載)?プラン).{0,30}(12\\s*万|120,?000)"
      - "(12\\s*万|120,?000)\\s*円.{0,30}(竹|CMS)"
      - "保守.{0,15}(1\\.?2\\s*万|12,?000)\\s*円"
  - key: absolute_claims
    label: 根拠のない断定
    patterns:
      - "日本(一|初|No\\.?1)"
      - "業界(最安値|No\\.?1|一)"
